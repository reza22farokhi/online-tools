name: Autonomous Site Doctor

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-doctor
  cancel-in-progress: false

jobs:
  health-check:
    name: Full platform health check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify every registered tool and run all functional E2E tests
        id: e2e
        run: npx playwright test --reporter=list,./scripts/site-doctor-reporter.mjs

      - name: Publish daily health summary
        if: always() && hashFiles('site-doctor-report.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/site-doctor-alert.mjs

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-doctor-report
          path: site-doctor-report.json
          if-no-files-found: ignore
          retention-days: 14
