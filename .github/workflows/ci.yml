name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  SITE_URL: https://reza22farokhi.github.io/online-tools
  BASE_PATH: /online-tools/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify dist
        run: |
          test -f dist/index.html
          TOOL_COUNT=$(find dist/tools -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Found $TOOL_COUNT built tool directories."
          if [ "$TOOL_COUNT" -lt 30 ]; then
            echo "Error: Too few tools built ($TOOL_COUNT). Expected at least 30."
            exit 1
          fi

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
