name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [security-seo-hardening]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci || npm install
      - name: Unit tests
        run: npx vitest run
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify dist
        run: test -f dist/index.html && test -f dist/tools/file-info/index.html
