name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); const summary = report.metadata?.vulnerabilities; if (!summary) { console.error("npm audit did not return a valid vulnerability summary"); process.exit(1); } console.log(JSON.stringify({summary, vulnerabilities: Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({name, severity: item.severity, range: item.range, via: item.via, fixAvailable: item.fixAvailable}))}, null, 2)); if ((summary.high || 0) > 0 || (summary.critical || 0) > 0) { console.error("High or critical dependency vulnerabilities block CI."); process.exit(1); }'

      - name: Unit tests
        run: npx vitest run

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          test -f dist/index.html
          node scripts/verify-tools.mjs
          npm run verify:performance

  e2e:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify preinstalled Playwright browser
        run: npx playwright --version

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify preinstalled Playwright browsers
        run: npx playwright --version

      - name: Build
        run: npm run build

      - name: Run Firefox and WebKit smoke tests
        run: npx playwright test --config=playwright.cross-browser.config.ts
