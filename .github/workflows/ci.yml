name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          
      - run: npm ci

      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); console.log(JSON.stringify({summary: report.metadata?.vulnerabilities, vulnerabilities: Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({name, severity: item.severity, range: item.range, via: item.via, fixAvailable: item.fixAvailable}))}, null, 2))'

      
      - name: Unit tests
        run: npx vitest run
      
      - name: Type check
        run: npm run check
      
      - name: Build
        run: npm run build
      
      - name: Verify dist
        run: |
          test -f dist/index.html
          node scripts/verify-tools.mjs

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          
      - run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build
        run: npm run build
      
      - name: Run E2E tests
        run: npx playwright test
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
